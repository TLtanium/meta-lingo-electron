<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icons/icon_64x64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta-Lingo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="early-error" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#fff; z-index:99999; padding:20px; font-family:monospace; overflow:auto;">
      <h2 style="color:#c00;">Application Error (Early)</h2>
      <pre id="early-error-msg" style="background:#f5f5f5; padding:10px; margin:10px 0; white-space:pre-wrap; word-break:break-word;"></pre>
      <button onclick="location.reload()" style="padding:8px 16px; cursor:pointer;">Reload</button>
    </div>
    <script>
      // Early error handler - catches errors before React loads
      window.onerror = function(msg, url, line, col, err) {
        console.error('[Early Error]', msg, url, line, col, err);
        var errDiv = document.getElementById('early-error');
        var errMsg = document.getElementById('early-error-msg');
        if (errDiv && errMsg) {
          errMsg.textContent = msg + '\n\nAt: ' + url + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '');
          errDiv.style.display = 'block';
        }
        return false;
      };
      window.onunhandledrejection = function(e) {
        console.error('[Early Promise Rejection]', e.reason);
        var reason = e.reason;
        var errDiv = document.getElementById('early-error');
        var errMsg = document.getElementById('early-error-msg');
        if (errDiv && errMsg) {
          errMsg.textContent = 'Unhandled Promise Rejection:\n\n' + (reason && reason.message ? reason.message : reason) + '\n\n' + (reason && reason.stack ? reason.stack : '');
          errDiv.style.display = 'block';
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
